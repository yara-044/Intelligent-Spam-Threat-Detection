
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B0B0B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Intelligent Spam Detector">
  <title>Intelligent Spam Detector</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="project_logo.png">
  <link rel="apple-touch-icon" href="project_logo.png">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B0B0B;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .container { padding: 30px; max-width: 420px; }
    img { width: 120px; height: 120px; object-fit: contain; }
    h1 { color: #F5C400; font-size: 27px; }
    p { color: #ccc; line-height: 1.6; }
    a, button {
      display: inline-block;
      margin-top: 18px;
      padding: 14px 24px;
      border: 0;
      border-radius: 9px;
      background: #F5C400;
      color: #111;
      font-weight: bold;
      font-size: 16px;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>               
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js")
        .then(() => console.log("App ready"))
        .catch(error => console.error("Service Worker error:", error));
    });
  }
</script>
<body>

    <img src="project_logo.png" alt="Project logo">

    </a>

    "Add to Home screen" or "Install app".</p>
